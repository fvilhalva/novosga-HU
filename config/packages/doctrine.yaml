doctrine:
    dbal:
        default_connection: default

        types:
            datetime: App\Doctrine\Types\UTCDateTimeType
            datetime_immutable: App\Doctrine\Types\UTCDateTimeImmutableType

        connections:
            default:
                url: '%env(resolve:DATABASE_URL)%'
                # IMPORTANT: You MUST configure your server version,
                # either here or in the DATABASE_URL env var (see .env file)
                #server_version: '16'
                profiling_collect_backtrace: '%kernel.debug%'
                use_savepoints: true

            # Conexão SOMENTE LEITURA com o AGHU (integração de agenda).
            # Nunca escrevemos nesta conexão. Valores reais em .env.local.
            # server_version fixo evita que o Doctrine conecte no boot só para
            # detectar a versão (mantém a conexão preguiçosa/segura).
            aghu:
                driver: pdo_pgsql
                host: '%env(AGHU_DB_HOST)%'
                port: '%env(int:AGHU_DB_PORT)%'
                dbname: '%env(AGHU_DB_NAME)%'
                user: '%env(AGHU_DB_USER)%'
                password: '%env(AGHU_DB_PASSWORD)%'
                charset: utf8
                server_version: '16'
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false
        dql:
            datetime_functions:
                unix_timestamp: App\Doctrine\Functions\UnixTimestampFunction
            string_functions:
                regex_replace: App\Doctrine\Functions\RegexReplaceFunction

when@test:
    doctrine:
        dbal:
            connections:
                default:
                    # "TEST_TOKEN" is typically set by ParaTest
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
