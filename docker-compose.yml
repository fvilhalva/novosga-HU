services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8091:80"
    volumes:
      - ./:/var/www/html
      - composer_cache:/root/.composer/cache
    depends_on:
      - db
    environment:
      # Segredo compartilhado com o HU-Speaker para assinar os tokens JWT do painel.
      # Definido via variavel de ambiente do host (NAO versionar o valor real).
      # Deve ser IDENTICO ao JWT_SECRET_KEY do .env do HU-Speaker.
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-changeme-set-in-host-env}"
    networks:
      - default      # rede interna: fala com o Postgres (db)
      - sga-net      # rede compartilhada: fala com o HU-Speaker
    restart: unless-stopped

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: novosga
      POSTGRES_USER: novosga
      POSTGRES_PASSWORD: novosga
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - default
    restart: unless-stopped

networks:
  sga-net:
    external: true   # a mesma rede externa usada pelo HU-Speaker

volumes:
  db_data:
  composer_cache:
